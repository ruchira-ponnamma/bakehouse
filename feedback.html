<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Reviews | Fresh Crumbs Bakehouse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header>
  <div class="logo"><a href="index.html"><img src="Images/Logo.png" alt="Fresh Crumbs Bakehouse Logo"><span class="logo-text">Fresh Crumbs Bakehouse</span></a></div>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="cakes.html">Cakes</a><a href="brownies.html">Brownies</a><a href="cookies.html">Cookies</a><a href="muffins.html">Muffins</a><a href="feedback.html" aria-current="page">Feedback</a></nav>
</header>
<main id="main-content" class="feedback-panel">
  <h2>What Our Customers Say</h2>
  <p>We'd love to hear about your experience with Fresh Crumbs Bakehouse.</p>
  <form id="feedbackForm" class="feedback-form" novalidate>
    <h3>Leave Your Feedback</h3>
    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="Your name" required maxlength="80">
    <label for="review">Your review</label>
    <textarea id="review" placeholder="Write your review..." required maxlength="2000"></textarea>
    <button type="submit">Submit Review</button>
  </form>
  <p id="message" class="feedback-message" role="status" aria-live="polite"></p>
  <section class="reviews" aria-labelledby="reviewsTitle"><h3 id="reviewsTitle">Customer Reviews</h3><div id="reviewList"></div></section>
</main>
<footer><p>📍 Fresh Crumbs Bakehouse - Vijayanagar 3rd Stage, Mysuru, Karnataka | ☎ 9876543210</p></footer>
<script>
const form = document.getElementById("feedbackForm");
const reviewList = document.getElementById("reviewList");
const message = document.getElementById("message");

function readReviews() {
  try {
    const saved = JSON.parse(localStorage.getItem("reviews") || "[]");
    return Array.isArray(saved)
      ? saved.filter(r => r && typeof r.name === "string" && typeof r.review === "string" && typeof r.date === "string")
      : [];
  } catch (error) {
    return [];
  }
}

function loadReviews() {
  reviewList.replaceChildren();
  readReviews().forEach(r => {
    const card = document.createElement("div");
    card.className = "review-card";
    const name = document.createElement("strong");
    name.textContent = r.name;
    const date = document.createElement("small");
    date.textContent = " (" + r.date + ")";
    const body = document.createElement("p");
    body.textContent = r.review;
    card.append(name, date, document.createElement("br"), body);
    reviewList.appendChild(card);
  });
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const name = document.getElementById("name").value.trim();
  const review = document.getElementById("review").value.trim();
  if (!name || !review) {
    message.textContent = "Please enter your name and review.";
    return;
  }
  const reviews = readReviews();
  reviews.unshift({ name, review, date: new Date().toLocaleString("en-GB") });
  try {
    localStorage.setItem("reviews", JSON.stringify(reviews));
  } catch (error) {
    message.textContent = "We couldn't save your feedback. Please try again.";
    return;
  }
  loadReviews();
  form.reset();
  message.textContent = "Thank you for sharing your feedback!";
});

loadReviews();
</script>
</body>
</html>
